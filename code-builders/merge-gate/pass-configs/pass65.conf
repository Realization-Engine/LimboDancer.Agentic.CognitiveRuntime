# Pass 65, Passengers, Riders, and crews: what the gate cannot work out for itself. Sourced by gate.sh; every value is optional.
# OWN: the pass's recorded games, copied from the live folder into the proof store before the baseline. Filled in as the increments make them.
OWN="p65-crew-gun p65-crew-tank p65-prc-halftrack p65-prc-halftrack-bu p65-prc-truck p65-mounted-truck p65-ovr-halftrack p65-rout-beneath p65-unload-fire p65-board-after-move p65-riders-woods p65-riders-fire"
# SWEEP_EXTRA: older games that hold loaded vehicles (p26-visual, p40-boarding), a CE crew or a truck under fire (p55-al-fire, p60-coll,
# p60-mixed-ce, p60-mtr-truck), which pass 65's rules may change: Passengers now take Collateral Attacks and survive their vehicle, and a
# surviving crew is now a vehicle crew (rulings R65.5, R65.7, R65.9, R65.19).
SWEEP_EXTRA="p26-visual,p40-boarding,p55-al-fire,p60-coll,p60-mixed-ce,p60-mtr-truck"
# SKIP_JSON: keys the pass adds to records kept as JSON, each the gate of a rule and inert for an older record. Filled in as built.
# 2b: prc, the PRC of each vehicle on a fire attack and an ordnance shot (ruling R65.5), written by every new plan that meets a vehicle.
# 2c: passengers, the OVR's Passengers on its fire facts (ruling R65.13); mounted is written only for a Passenger firer, which no older record has.
# 2d: interim on every new unload step (D6.5's interim move); embarking, the (un)loaders on a First Fire attack.
SKIP_JSON='prc,passengers,interim,embarking'
# BOTH_SKIP: properties left out on BOTH sides. The catalog goes to 1.18.0 (ruling R65.3), and its identity is hashed into every state
# (pass 55's lesson); GameEvent.RulePackage in case a task must pin a package again.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
# PRESENT and ABSENT: a name the baseline's sources must hold (pass 60 and PR 32, the base) and one they must not (this pass).
PRESENT="ScenarioA1HeEquivalency"
ABSENT="IsCrew"
