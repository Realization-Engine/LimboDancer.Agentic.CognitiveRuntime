# SWEEP_EXTRA: games added to the standing sweep list for this pass, comma-separated. Older games that hold attacks on vehicles and Guns
# (ordnance shots, a CE crew's Collateral Attack, Bounding First Fire), which pass 60's rules may change. The pass's own games are not swept on
# the baseline's side: their records carry facts main's reader does not know.
SWEEP_EXTRA="p55-can-used,p55-duel-miss,p55-al-fire,p50-bff-move2,p50-same-rear,p35-bog"
# SKIP_JSON: keys the pass added to records kept as JSON. None is named: every new key is unwritten when null, and the replay digest after each
# task (the pass's replay_now.sh, with the gate's skip list) found no line of the older games differing.
SKIP_JSON=''
# BOTH_SKIP: properties left out on BOTH sides. The pass changed neither the catalog nor a package (its tables are Rules code, ruling R60.2);
# the three are named so that the baseline made at the branch's cut serves the gate, and they hide nothing the pass changed.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
# PRESENT and ABSENT: a name the baseline's sources must hold (the Goodwood merge, the base) and one they must not (this pass).
PRESENT="BoardHandleLocationChains"
ABSENT="ScenarioA1HeEquivalency"
