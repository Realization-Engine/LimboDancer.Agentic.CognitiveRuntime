# Pass 60, Armored combat III: what the gate cannot work out for itself. Sourced by gate.sh; every value is optional.
# OWN: the pass's recorded games, copied from the live folder into the proof store before the baseline. p60-random-sw is left out: it recorded
# heldWeapons, which the reviews' fixes no longer record, and it is labelled SUPERSEDED by p60-random-sw2 (design, section 13.2).
