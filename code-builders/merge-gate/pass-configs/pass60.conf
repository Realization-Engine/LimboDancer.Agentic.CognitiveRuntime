# Pass 60, Armored combat III: what the gate cannot work out for itself. Sourced by gate.sh; every value is optional.
# OWN: the pass's recorded games, copied from the live folder into the proof store before the baseline. p60-random-sw is left out: it recorded
# heldWeapons, which the reviews' fixes no longer record, and it is labelled SUPERSEDED by p60-random-sw2 (design, section 13.2).
OWN="p60-ap p60-atr-gun p60-check-controls p60-coll p60-conc p60-dc-afv p60-ft-afv p60-hidden p60-mg-coll p60-mg-stun p60-mixed-ce p60-mixed p60-mol-afv p60-mtr-afv p60-mtr-gun p60-mtr-levels p60-mtr-truck p60-pf p60-psk-open p60-psk p60-random-sw2 p60-unattended p60-unseen-afv"
# SWEEP_EXTRA: games added to the standing sweep list for this pass, comma-separated. Older games that hold attacks on vehicles and Guns
# (ordnance shots, a CE crew's Collateral Attack, Bounding First Fire), which pass 60's rules may change. The pass's own games are not swept on
# the baseline's side: their records carry facts main's reader does not know.
SWEEP_EXTRA="p55-can-used,p55-duel-miss,p55-al-fire,p50-bff-move2,p50-same-rear,p35-bog"
# SKIP_JSON: keys the pass added to records kept as JSON. The gate's first proofs run stopped at its early check: five Fire plans of older games
# differed by the hash of their planned events alone (p31c-tw-r471), since every new fire attack writes randomDestruction: true into its facts.
# Named here are the pass's facts written on attacks of kinds that existed before (each the gate of a rule, ruling R60.3, inert for an older
# record, as the replay digest after every task showed): A9.74's on fire and ordnance, D.8A's and its crew fact on a shot at a vehicle, C3.71's
# reversal on an uphill shot, and a mortar's Locations, hex Acquisition, and D9.3 cover.
SKIP_JSON='randomDestruction,specificCollateral,crewExposed,reversesHeightAdvantage,areaAcquisition,areaLocations,afvCover'
# BOTH_SKIP: properties left out on BOTH sides. The pass changed neither the catalog nor a package (its tables are Rules code, ruling R60.2);
# the three are named so that the baseline made at the branch's cut serves the gate, and they hide nothing the pass changed.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
# PRESENT and ABSENT: a name the baseline's sources must hold (the Goodwood merge, the base) and one they must not (this pass).
PRESENT="BoardHandleLocationChains"
ABSENT="ScenarioA1HeEquivalency"
