# The ASL Turns architecture (branch codex/asl-turns-backend, PR 44, 2026-10-28): what the gate cannot work out for itself. Sourced by gate.sh.
# The branch adds the Turn Phase Guide and new event kinds (Spotter designation, work, Placed DC windows, packing journals); no game made
# before it uses them, so every older game must replay and sweep as it did on main. CODE_MOVE=1 sweeps every cut of the swept game for
# that reason, and because its last commits move rule decisions from Play, the projector and ASL.Turns into Rules without a verdict change.
CODE_MOVE=1
# OWN: none. The branch records no proof game; its behavior is asserted by its tests.
OWN=""
# BOTH_SKIP: as the Play Step Plan's, so that a baseline cached for the same base serves.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
# PRESENT and ABSENT: a name the baseline's sources must hold (pass 71) and one they must not (this branch's Rules calculators).
PRESENT="SniperCheck"
ABSENT="TurnWorkRules"
