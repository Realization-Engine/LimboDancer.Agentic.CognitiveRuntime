# The Play Step Plan (branch play-step, 2026-10-19): what the gate cannot work out for itself. Sourced by gate.sh; every value is optional.
# The work changes no rule (the plan's V2): it asks Rules the same questions fewer times and reads files less. So it is a code move:
# CODE_MOVE=1 sweeps every cut of p31c-tw, and the replay digest and the sweep must equal the baseline's in every line (the plan's V3).
CODE_MOVE=1
# OWN: none. The work records no game of its own.
OWN=""
# BOTH_SKIP: as pass 60's, so that a baseline cached for the same base serves; the work changes neither the catalog nor a package.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
# PRESENT and ABSENT: a name the baseline's sources must hold and one they must not (the plan's memo, task 1).
PRESENT="BoardHandleLocationChains"
ABSENT="PlayStepMemo"
