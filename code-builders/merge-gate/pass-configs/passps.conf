# The Play Streamlining Plan (branch play-streamlining, 2026-10-21): what the gate cannot work out for itself. Sourced by gate.sh; every value is
# optional. The work changes no rule: the movement plan makes each step with the ordinary move and pass, the plot runs the move's own plan on
# events it never stores, and the new planner questions (RallyBar, RecoverPhaseBar, PhaseEndBar, DefenderMayFire) read the checks the gate already
# makes. So it is a code move: CODE_MOVE=1 sweeps every cut of p31c-tw, and the replay digest and the sweep must equal the baseline's in every line.
CODE_MOVE=1
# OWN: none. The measurement games (ps-3v3-*) are live data, not recorded games of the work.
OWN=""
# BOTH_SKIP: as the A3 plan's, so that a baseline cached for the same base serves; the work changes neither the catalog nor a package.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
# PRESENT and ABSENT: a name the baseline's sources must hold and one they must not (the Play Step Plan's memo; this work's plot).
PRESENT="PlayStepMemo"
ABSENT="MovementPlot"
