# Claim C9.3 Spotters (branch claim/c9.3-spotters, the first claim on the open board, 2026-10-28): what the gate cannot work out for itself.
# Sourced by gate.sh. The claim moves every C9.3 decision into one Rules calculator, ScenarioA1SpotterCalculator, from the ordnance
# calculators, the four Turns spotter rules, Play, the projector, ASL.Turns, and the Play page. Where two readings disagreed, the claim's
# design rules which one holds; no game made before it is meant to replay or sweep differently, so CODE_MOVE=1 sweeps every cut of the
# swept game.
CODE_MOVE=1
# OWN: none at the cut. The claim's behavior is asserted by its tests and its minigame's checks.
OWN=""
# BOTH_SKIP: as the Turns branch's, so that a baseline cached for the same base serves.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
# PRESENT and ABSENT: a name the baseline's sources must hold and one they must not (this claim's calculator).
PRESENT="TurnSpotterTimingRules"
ABSENT="ScenarioA1SpotterCalculator"
