# The Berserk Charge Plan (branch berserk-charge-memo, 2026-10-23): what the gate cannot work out for itself. Sourced by gate.sh.
# The work changes no rule (the plan's D2): the charge search is asked once per state and reads the units through an index of the state's
# objects, with the same answers. So it is a code move: CODE_MOVE=1, and the digest and the sweep must equal the baseline's (the plan's D3).
CODE_MOVE=1
# OWN: none. The checks are made on followers of the user's game, which are deleted after.
OWN=""
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
PRESENT="PlayStepMemo"
ABSENT="ChargeKey"
