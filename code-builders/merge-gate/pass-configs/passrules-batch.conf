# The batch gate of the rule claims (the Rules-first plan, section 4.3; the user, 2026-10-29): sourced by gate.sh, run on main.
# A rule claim changes the Rules library and its tests only, and an old member keeps its answer, so it merges on CI without a gate of
# its own. After every fifth rule claim merged since the last batch gate (claim_check.py says when), the gate runs on main against the
# last gated main commit, which the inventory's section 6 records:
#   bash code-builders/merge-gate/gate.sh rules-batch <last gated commit> baseline|build|proofs|carry
# No game may replay or sweep differently, so CODE_MOVE=1. A difference names a member whose answer a claim changed: fix it forward.
CODE_MOVE=1
# OWN: none. The batch adds no games; the rule claims' behavior is asserted by their tests and their minigames' checks.
OWN=""
# BOTH_SKIP: as the claims' and the Turns branch's, so that one baseline serves them all and carries from batch to batch.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
PRESENT=""
ABSENT=""
