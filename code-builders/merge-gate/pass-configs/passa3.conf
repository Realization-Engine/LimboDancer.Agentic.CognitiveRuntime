# The A3 Map Context Plan (branch map-context, 2026-10-19): what the gate cannot work out for itself. Sourced by gate.sh; every value is optional.
# A3 changes no rule (the plan's W2): it asks the same map questions and gets the same answers with fewer lookups. So it is a code move:
# CODE_MOVE=1 sweeps every cut of p31c-tw, and the replay digest and the sweep must equal the baseline's in every line.
CODE_MOVE=1
# OWN: the placed-map test game of task 1 (bd04 with bd02 reversed, a Rout Phase across the seam), replayed on both sides.
OWN="a3-gambit-rout"
# SWEEP_EXTRA: the same game, swept on both sides, so the placed-map reads are compared too (the plan's W2).
SWEEP_EXTRA="a3-gambit-rout"
# BOTH_SKIP: as the Play Step Plan's, so that a baseline cached for the same base serves; A3 changes neither the catalog nor a package.
BOTH_SKIP="GameState.Catalog,DefinitionReference.Catalog,GameEvent.RulePackage"
# PRESENT and ABSENT: a name the baseline's sources must hold and one they must not (the Play Step Plan's memo; A3's map context).
PRESENT="PlayStepMemo"
ABSENT="MapContext"
