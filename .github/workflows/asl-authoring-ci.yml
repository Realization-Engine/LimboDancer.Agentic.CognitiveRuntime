name: ASL Authoring CI

on:
  push:
    branches:
      - decision-plane
    paths:
      - "src/ASL/**"
      - "utils/pdf_to_markdown.py"
      - "docs/ASL/Rulebook_Markdown/**"
      - "docs/ASL/SourceRegistry/**"
      - ".github/workflows/asl-authoring-ci.yml"
  pull_request:
    paths:
      - "src/ASL/**"
      - "utils/pdf_to_markdown.py"
      - "docs/ASL/Rulebook_Markdown/**"
      - "docs/ASL/SourceRegistry/**"
      - ".github/workflows/asl-authoring-ci.yml"

permissions:
  contents: read

jobs:
  source-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/ASL/LimboDancer.Domains.Asl.sln --locked-mode

      - name: Build
        run: dotnet build src/ASL/LimboDancer.Domains.Asl.sln --configuration Release --no-restore --warnaserror

      - name: Test source registry and fragment locator
        run: dotnet test src/ASL/LimboDancer.Domains.Asl.sln --configuration Release --no-build --no-restore
