name: ASL Authoring CI

on:
  push:
    branches:
      - decision-plane
      - main
    paths:
      - "src/ASL/**"
      - "Directory.Packages.props"
      - "global.json"
      - "src/LimboDancer/LimboDancer.Abstractions/**"
      - "src/LimboDancer/LimboDancer.Runtime/**"
      - "code-builders/**"
      - "src/LimboDancer/LimboDancer.Host/**"
      - "utils/pdf_to_markdown.py"
      - "docs/ASL/Rulebook_Markdown/**"
      - "docs/ASL/SourceRegistry/**"
      - "docs/ASL/Schemas/**"
      - "docs/ASL/TIR/**"
      - ".github/workflows/asl-authoring-ci.yml"
  pull_request:
    paths:
      - "src/ASL/**"
      - "Directory.Packages.props"
      - "global.json"
      - "src/LimboDancer/LimboDancer.Abstractions/**"
      - "src/LimboDancer/LimboDancer.Runtime/**"
      - "code-builders/**"
      - "src/LimboDancer/LimboDancer.Host/**"
      - "utils/pdf_to_markdown.py"
      - "docs/ASL/Rulebook_Markdown/**"
      - "docs/ASL/SourceRegistry/**"
      - "docs/ASL/Schemas/**"
      - "docs/ASL/TIR/**"
      - ".github/workflows/asl-authoring-ci.yml"

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      broad: ${{ steps.scope.outputs.broad }}
      acronyms: ${{ steps.scope.outputs.acronyms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "broad=true" >> "$GITHUB_OUTPUT"
            echo "acronyms=true" >> "$GITHUB_OUTPUT"
          else
            python3 code-builders/asl-acronyms/ci_scope.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          fi
      # The Rules-first plan (questions 1 to 3 and 10, 2026-10-28): the rule inventory's claim board and each pass's Rules status line.
      # On a pull request the branch's changed Rules files must be held by its claims; on a push only the ledger is checked.
      - name: Rule claims and Rules status lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 code-builders/documents/pass_rules_status.py --check
          if [ -n "$BRANCH" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 code-builders/documents/claim_check.py --base "$BASE" --branch "$BRANCH"
          else
            python3 code-builders/documents/claim_check.py
          fi

  acronyms:
    needs: scope
    if: needs.scope.outputs.acronyms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test only Acronym Search
        run: dotnet test src/ASL/tests/ASL.Acronyms.Tests/ASL.Acronyms.Tests.csproj --configuration Release -p:RestoreLockedMode=true
      - name: Verify packaged catalog
        run: >-
          dotnet run --project code-builders/asl-acronyms/AslAcronyms.csproj --configuration Release --no-build --
          verify "src/ASL/docs/ASL Rulebook Acronym Scan.md"
          "src/ASL/docs/ASL Acronym Expanded-Term Search Ledger.csv"
          src/ASL/LimboDancer.Domains.Asl.MapStudio/Data/acronyms.catalog.json

  # The test projects run as parallel jobs, each on its own machine (2026-10-24): in one job the four large projects shared four cores, and
  # Authoring's 9:35 set the run's length. Each job builds the whole solution with warnings as errors, so every job also proves the strict build.
  source-conformance:
    needs: scope
    if: needs.scope.outputs.broad == 'true'
    name: source-conformance (${{ matrix.share }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - share: authoring
            tests: src/ASL/tests/LimboDancer.Domains.Asl.Authoring.Tests
          - share: mapstudio
            tests: src/ASL/tests/LimboDancer.Domains.Asl.MapStudio.Tests
            node: true
          - share: rules
            tests: src/ASL/tests/LimboDancer.Domains.Asl.Rules.Tests
          - share: play
            tests: src/ASL/tests/LimboDancer.Domains.Asl.Play.Tests
          - share: the rest
            tests: >-
              src/ASL/tests/LimboDancer.Domains.Asl.Maps.Tests
              src/ASL/tests/LimboDancer.Domains.Asl.Maps.Rendering.Tests
              src/ASL/tests/LimboDancer.Domains.Asl.Maps.Vasl.Tests
              src/ASL/tests/LimboDancer.Domains.Asl.Units.Tests
              src/ASL/tests/LimboDancer.Domains.Asl.Units.Rendering.Tests
              src/ASL/tests/LimboDancer.Domains.Asl.Units.CounterSheets.Tests
              src/ASL/tests/LimboDancer.Dice.Tests
              src/ASL/tests/ASL.Turns.Tests
            cli: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/ASL/LimboDancer.Domains.Asl.sln --locked-mode

      - name: Build
        run: dotnet build src/ASL/LimboDancer.Domains.Asl.sln --configuration Release --no-restore --warnaserror

      - name: Test Map Studio viewport interactions
        if: matrix.node
        run: node --test src/ASL/tests/LimboDancer.Domains.Asl.MapStudio.Tests/boardViewport.pointer.test.mjs

      - name: Test ${{ matrix.share }}
        run: |
          failed=0
          for project in ${{ matrix.tests }}; do
            dotnet test "$project" --configuration Release --no-build --no-restore || failed=1
          done
          exit $failed

      - name: Generate and check Scenario A1 source verification batch
        if: matrix.cli
        run: |
          dotnet run --project src/ASL/LimboDancer.Domains.Asl.Authoring.Cli --configuration Release --no-build --no-restore -- \
            --source-commit a3254ff1d492dbdd28483d86f5b42437b48e80d4 \
            --registry-output "$RUNNER_TEMP/asl-source-registry.json" \
            --verification-output "$RUNNER_TEMP/asl-verification-sample.json" \
            --a1-attestation docs/ASL/SourceRegistry/asl-scenario-a1.source-attestation.json \
            --a1-verification-output "$RUNNER_TEMP/asl-scenario-a1.source-verification.json"
          cmp docs/ASL/SourceRegistry/asl-scenario-a1.source-verification.json "$RUNNER_TEMP/asl-scenario-a1.source-verification.json"

      - name: Generate and check pending Scenario A1 comparison records
        if: matrix.cli
        run: |
          dotnet run --project src/ASL/LimboDancer.Domains.Asl.Authoring.Cli --configuration Release --no-build --no-restore -- \
            --source-commit a3254ff1d492dbdd28483d86f5b42437b48e80d4 \
            --registry-output "$RUNNER_TEMP/asl-source-registry.json" \
            --verification-output "$RUNNER_TEMP/asl-verification-sample.json" \
            --a1-attestation docs/ASL/SourceRegistry/asl-scenario-a1.source-attestation.json \
            --a1-comparison docs/ASL/SourceRegistry/asl-scenario-a1.first-case-pdf-comparison.json \
            --a1-comparison-output "$RUNNER_TEMP/asl-scenario-a1.pending-comparison-records.json"
          cmp docs/ASL/SourceRegistry/asl-scenario-a1.pending-comparison-records.json "$RUNNER_TEMP/asl-scenario-a1.pending-comparison-records.json"

      - name: Regenerate bounded Scenario A1 chart supplement
        if: matrix.cli
        run: |
          dotnet run --project src/ASL/LimboDancer.Domains.Asl.Authoring.Cli --configuration Release --no-build --no-restore -- \
            --source-commit a3254ff1d492dbdd28483d86f5b42437b48e80d4 \
            --registry-output "$RUNNER_TEMP/asl-source-registry.json" \
            --verification-output "$RUNNER_TEMP/asl-verification-sample.json" \
            --a1-supplement-candidate docs/ASL/SourceRegistry/asl-scenario-a1.backmatter-chart-candidate.json \
            --a1-supplement-output "$RUNNER_TEMP/asl-scenario-a1.supplementary-source-registry.json"
          diff -u \
            <(jq -S . docs/ASL/SourceRegistry/asl-scenario-a1.supplementary-source-registry.json) \
            <(jq -S . "$RUNNER_TEMP/asl-scenario-a1.supplementary-source-registry.json")
